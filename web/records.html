<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c7056">
  <title>祂的记录 · wardrobe</title>
  <link rel="stylesheet" href="records.css">
</head>
<body>
<div class="ground" id="ground"><div class="shade" id="shade"></div></div>

<main class="page">
  <section id="tab-uses" aria-label="祂的记录">
    <h1 class="title">祂的记录 <small>あの人の記録 · a notepad</small></h1>
    <p class="np-counter" id="uses-count"></p>
    <div class="np-book">
      <div class="np-pad"><div class="np-rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="np-stack" id="usesList"></div></div>
      <div class="np-turn"><button type="button" data-np-prev>↓ 翻回来</button><span class="dots"></span><button type="button" data-np-next>翻过去 ↑</button></div>
      <p class="np-hint">往上一划也能翻页 · 每一页排法都不一样</p>
    </div>
  </section>
</main>

<div class="toast pill" id="toast" role="status" aria-live="polite"></div>
<script src="records.js" defer></script>
</body>
</html>
